[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-forge"
version = "0.1.0"
description = "Axiom_FoRgE: a bounded evidence-first CLI for MONAS Crucible"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
axiom-forge = "axiom_forge.__main__:main"

[tool.setuptools.packages.find]
include = ["axiom_forge*"]
